<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar — Escola Nova Geração</title>
<link rel="icon" type="image/png" sizes="128x128" href="/favicon-128.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-128.png">
<link rel="shortcut icon" href="/favicon.ico">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#1560D0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Nova Geração">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--fundo:#F5F7F9;--tinta:#131A22;--tinta2:#5B6874;--linha:#DFE5EB;--marca:#1560D0;--marca2:#0E3F8C;--bloq:#C22218}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--fundo);
  font:15px/1.5 Inter,system-ui,sans-serif;color:var(--tinta);padding:1.2rem;overflow-x:hidden}

/* Portal inicial: Botão disfarçado com favicon flutuante e pulsante */
.portal-wrapper{
  position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:var(--fundo);z-index:50;
  transition:opacity .45s cubic-bezier(.4,0,.2,1),transform .45s cubic-bezier(.4,0,.2,1);
}
.portal-wrapper.oculto{
  opacity:0;transform:scale(1.12);pointer-events:none;
}
.portal-btn{
  position:relative;background:none;border:none;padding:1.8rem;cursor:pointer;
  outline:none;border-radius:32px;display:flex;flex-direction:column;align-items:center;
  -webkit-tap-highlight-color:transparent;user-select:none;
}
.portal-float{
  animation:flutuar 3.4s ease-in-out infinite;
  display:flex;align-items:center;justify-content:center;
}
.portal-img{
  width:96px;height:96px;border-radius:24px;display:block;
  animation:pulsar 2.5s ease-in-out infinite;
  filter:drop-shadow(0 8px 22px rgba(21,96,208,.22));
  transition:transform .28s cubic-bezier(.34,1.56,.64,1),filter .28s ease;
}
.portal-btn:hover .portal-img,
.portal-btn:focus-visible .portal-img{
  transform:scale(1.12);
  filter:drop-shadow(0 14px 34px rgba(21,96,208,.38));
}

@keyframes flutuar{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-12px)}
}
@keyframes pulsar{
  0%,100%{transform:scale(1);opacity:.94}
  50%{transform:scale(1.05);opacity:1}
}

/* Tooltip elegante que surge no hover */
.portal-tooltip{
  position:absolute;top:calc(100% - .4rem);left:50%;
  transform:translateX(-50%) translateY(4px);
  background:rgba(19,26,34,.94);color:#fff;
  font:500 .86rem/1.3 Inter,sans-serif;letter-spacing:-.01em;
  padding:.45rem .95rem;border-radius:999px;
  white-space:nowrap;pointer-events:none;opacity:0;
  box-shadow:0 6px 20px rgba(0,0,0,.18);
  backdrop-filter:blur(8px);
  transition:opacity .22s cubic-bezier(.4,0,.2,1),transform .22s cubic-bezier(.4,0,.2,1);
}
.portal-tooltip::before{
  content:"";position:absolute;bottom:100%;left:50%;transform:translateX(-50%);
  border-width:5px;border-style:solid;
  border-color:transparent transparent rgba(19,26,34,.94) transparent;
}
.portal-btn:hover .portal-tooltip,
.portal-btn:focus-visible .portal-tooltip{
  opacity:1;transform:translateX(-50%) translateY(8px);
}

/* Caixa de Login */
.caixa{
  width:100%;max-width:380px;background:#fff;border:1px solid var(--linha);
  border-radius:12px;box-shadow:0 4px 20px rgba(19,26,34,0.05);padding:2.2rem 1.9rem;
  transition:opacity .45s cubic-bezier(.4,0,.2,1),transform .45s cubic-bezier(.4,0,.2,1);
  position:relative;z-index:10;
}
.caixa.oculta{
  display:none;opacity:0;transform:scale(.95) translateY(12px);
}
.caixa.visivel{
  display:block;opacity:1;transform:scale(1) translateY(0);
}
.caixa img{height:74px;width:auto;display:block;margin:0 auto 1.4rem}
h1{font-family:Archivo,sans-serif;font-size:1.15rem;margin:0 0 1.3rem;text-align:center;font-weight:700;letter-spacing:-0.01em;color:var(--tinta)}
label{display:block;font-size:.68rem;letter-spacing:.07em;text-transform:uppercase;color:var(--tinta2);font-weight:600;margin:.9rem 0 .35rem}
input{width:100%;padding:.72rem .85rem;border:1px solid var(--linha);border-radius:8px;font:inherit;outline:none;transition:border-color .15s, box-shadow .15s}
input:focus{border-color:var(--marca);box-shadow:0 0 0 3px rgba(21,96,208,.13)}
button.btn-entrar{width:100%;margin-top:1.4rem;padding:.75rem;border:0;border-radius:8px;background:var(--marca);color:#fff;
  font:600 .95rem Inter,sans-serif;cursor:pointer;transition:background .15s}
button.btn-entrar:hover{background:var(--marca2)} button.btn-entrar:disabled{opacity:.6;cursor:wait}
.erro{color:var(--bloq);font-size:.83rem;margin-top:.9rem;min-height:1.2em;text-align:center}
</style></head><body>

  <button type="button" id="btnPortal" class="portal-btn" aria-label="Clique para fazer login" title="Clique para fazer login">
    <div class="portal-float">
      <img src="/favicon-128.png" alt="Escola Nova Geração" class="portal-img">
    </div>
    <div class="portal-tooltip" role="tooltip">Clique para fazer login</div>
  </button>
</div>

  <h1>Sistema de gestão</h1>
  <label for="email">E-mail</label><input id="email" type="email" autocomplete="username" required>
  <label for="senha">Senha</label><input id="senha" type="password" autocomplete="current-password" required>
  <button class="btn-entrar" id="b">Entrar</button>
  <div class="erro" id="erro" role="alert"></div>
</form>

<script type="module">
let balloonsFn = null;
let textBalloonsFn = null;

import('/balloons.js').then((mod) => {
  balloonsFn = mod.balloons;
  textBalloonsFn = mod.textBalloons;
  window.balloons = mod.balloons;
  window.textBalloons = mod.textBalloons;
}).catch((err) => {
  console.warn('Efeito balloons-js não pôde ser pré-carregado:', err);
});

// Lógica compatível com o componente Balloons fornecido
function launchAnimation(props = { type: 'default' }) {
  const type = props.type || 'default';
  const text = props.text;
  const fontSize = props.fontSize || 120;
  const color = props.color || '#1560D0';

  try {
    if (type === 'default') {
      const fn = balloonsFn || window.balloons;
      if (typeof fn === 'function') fn();
    } else if (type === 'text' && text) {
      const fn = textBalloonsFn || window.textBalloons;
      if (typeof fn === 'function') {
        fn([{ text, fontSize, color }]);
      }
    }
  } catch (err) {
    console.warn('Erro ao disparar animação de balões:', err);
  }

  if (typeof props.onLaunch === 'function') {
    props.onLaunch();
  }
}
window.launchAnimation = launchAnimation;

let loginAberto = false;
function abrirLogin() {
  if (loginAberto) return;
  loginAberto = true;

  launchAnimation({
    type: 'default',
    onLaunch: () => {
      const portal = document.getElementById('portalIntro');
      const f = document.getElementById('f');
      if (portal) {
        portal.classList.add('oculto');
        setTimeout(() => { portal.style.display = 'none'; }, 450);
      }
      if (f) {
        f.classList.remove('oculta');
        f.style.display = 'block';
        requestAnimationFrame(() => {
          f.classList.add('visivel');
          setTimeout(() => { document.getElementById('email')?.focus(); }, 250);
        });
      }
    }
  });
}
window.abrirLogin = abrirLogin;

const btnPortal = document.getElementById('btnPortal');
if (btnPortal) {
  btnPortal.addEventListener('click', abrirLogin);
  btnPortal.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      abrirLogin();
    }
  });
}

// Se o usuário clicar ou focar no email programaticamente, garante a transição
const emailInput = document.getElementById('email');
if (emailInput) {
  emailInput.addEventListener('focus', () => { if (!loginAberto) abrirLogin(); });
}

// Submissão do login
document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const b = document.getElementById('b'), erro = document.getElementById('erro');
  const emailVal = document.getElementById('email').value.trim();
  const senhaVal = document.getElementById('senha').value;
  b.disabled = true; erro.textContent = '';
  try {
    const r = await fetch('/api/login', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ email: emailVal, senha: senhaVal }) });
    if (r.ok) { location.href = '/'; return; }
    erro.textContent = (await r.json()).erro || 'Não foi possível entrar.';
  } catch { erro.textContent = 'Sem conexão com o servidor.'; }
  finally { b.disabled = false; }
});

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  });
}
</script>
